# Workflow configuration for S-CORE CI - Bazel Build & Test for QNX target platform
# This workflow runs Bazel build and test for QNX when triggered by specific pull request events.

name: QNX
on:
  push:
    branches: [main]
  pull_request_target:
    types: [opened, reopened, synchronize, labeled, unlabeled]
  merge_group:
    types: [checks_requested]
  workflow_call:
    inputs:
      cache_mode:
        description: "Cache mode override (empty = auto-compute from event context)"
        required: false
        type: string
        default: ""
      fetch_only:
        description: "When true, runs --nobuild to fetch dependencies only."
        required: false
        type: string
        default: "false"
    secrets:
      SCORE_QNX_LICENSE:
        required: true
      SCORE_QNX_USER:
        required: true
      SCORE_QNX_PASSWORD:
        required: true
      UBUNTU_SNAPSHOT_MIRROR_URL:
        required: false

concurrency:
  group: build_and_test_qnx-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request_target' }}

jobs:
    precheck:
      runs-on: ubuntu-24.04
      outputs:
        should-run: ${{ steps.gate.outputs.should-run }}
        require-approval: ${{ steps.gate.outputs.require-approval }}
      permissions:
        contents: read
        pull-requests: read
      steps:
        - name: Evaluate QNX workflow gate
          id: gate
          env:
            EVENT_NAME: ${{ github.event_name }}
          run: |
            python3 - <<'SCRIPT_END'
            import json
            import os

            should_run = True
            require_approval = False

            with open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8") as event_file:
                event = json.load(event_file)

            pr = event.get("pull_request") or {}
            head_repo = (((pr.get("head") or {}).get("repo") or {}).get("full_name") or "")
            base_repo = (((pr.get("base") or {}).get("repo") or {}).get("full_name") or "")
            labels = {label.get("name", "") for label in (pr.get("labels") or [])}

            if os.environ["EVENT_NAME"] == "pull_request_target" and head_repo != base_repo:
                if "test-qnx" in labels:
                    require_approval = True
                else:
                    should_run = False
            
            should_run_string = 'true' if should_run else 'false'
            require_approval_string = 'true' if require_approval else 'false'

            labels_display = ", ".join(sorted(label for label in labels if label)) or "(none)"
            print(
                "QNX gate evaluation: "
                f"event_name='{os.environ['EVENT_NAME']}', "
                f"head_repo='{head_repo}', "
                f"base_repo='{base_repo}', "
                f"labels=[{labels_display}], "
                f"outputs: should-run={should_run_string}, "
                f"require-approval={require_approval_string}"
            )

            with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as github_output:
                print(f"should-run={should_run_string}", file=github_output)
                print(f"require-approval={require_approval_string}", file=github_output)
            SCRIPT_END

    approval:
      needs: precheck
      if: ${{ needs.precheck.outputs.require-approval == 'true' }}
      environment: 'workflow-approval'
      runs-on: ubuntu-24.04
      permissions:
        contents: read
        pull-requests: read
      steps:
        - name: Blocking on approval
          run: ''

    build_and_test_qnx:
      name: QCC - Build & Test
      needs:
        - precheck
        - approval
      if: ${{ !cancelled() && needs.precheck.outputs.should-run == 'true' && (needs.approval.result == 'success' || needs.approval.result == 'skipped') }}
      runs-on: ubuntu-24.04
      permissions:
        contents: read
        pull-requests: read
        actions: write
      steps:
        - name: Checkout repository
          uses: actions/checkout@v6.0.2
          with:
            ref: ${{ github.head_ref || github.event.pull_request.head.ref || github.ref }}
            repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
        - name: Setup QNX and QEMU environment
          uses: ./.github/actions/00_infrastructure/setup_qnx_environment
          with:
            qnx-license: ${{ secrets.SCORE_QNX_LICENSE }}
        - name: Setup Bazel environment
          uses: ./.github/actions/00_infrastructure/prepare_bazel_environment
          with:
            disk-cache: ${{ inputs.fetch_only != 'true' && 'build_and_test_qnx' || '' }}
            cache-mode: ${{ inputs.cache_mode }}
            ubuntu-snapshot-mirror-url: ${{ secrets.UBUNTU_SNAPSHOT_MIRROR_URL }}
        - name: Report CI resources
          run: |
            exec > >(tee ci-resource-report.log) 2>&1
            echo "===== CPU ====="
            nproc
            lscpu

            echo "===== RAM ====="
            free -h

            echo "===== DISK ====="
            df -h

            echo "===== CPU FREQUENCY ====="
            grep -E "model name|cpu MHz" /proc/cpuinfo | head -20

            echo "===== LOAD ====="
            uptime

            echo "===== CPU STATISTICS ====="
            cat /proc/loadavg
            cat /proc/stat | head -6
            echo "CPU iowait/steal fields are the 5th/8th fields in /proc/stat"
            awk '$1 == "cpu" {print "iowait=" $6, "steal=" $9}' /proc/stat
            vmstat 1 2

            echo "===== DISK I/O COUNTERS ====="
            cat /proc/diskstats

            echo "===== MEMORY PRESSURE ====="
            cat /proc/pressure/memory 2>/dev/null || true
            cat /proc/pressure/io 2>/dev/null || true

            echo "===== CGROUP LIMITS ====="
            echo "--- /proc/self/cgroup"
            cat /proc/self/cgroup
            for file in /sys/fs/cgroup/cpu.max /sys/fs/cgroup/cpu.stat /sys/fs/cgroup/memory.max /sys/fs/cgroup/memory.current /sys/fs/cgroup/cpu/cpu.cfs_quota_us /sys/fs/cgroup/cpu/cpu.cfs_period_us /sys/fs/cgroup/memory/memory.limit_in_bytes /sys/fs/cgroup/memory/memory.usage_in_bytes; do
              if [ -f "$file" ]; then
                echo "--- $file"
                cat "$file"
              fi
            done

            echo "===== NETWORK ====="
            ip -details link
            ss -s
        - name: Build QNX
          if: inputs.fetch_only != 'true'
          env:
            SCORE_QNX_USER: ${{ secrets.SCORE_QNX_USER }}
            SCORE_QNX_PASSWORD: ${{ secrets.SCORE_QNX_PASSWORD }}
          run: bazel build --config=ci --config=qnx -- //quality/integration_testing/environments/dual_qemu/example_xvm:test_lib_memory_ivshmem_xvm //score/mw/com/gateway/transport_layer/qemu/test/integration_test:test_qemu_transport
        - name: Monitor resources during tests
          if: inputs.fetch_only != 'true'
          run: |
            : > ci-resource-monitor.log
            (
              while true; do
                {
                  date
                  uptime
                  free -h
                  cat /proc/pressure/cpu 2>/dev/null || true
                  cat /proc/pressure/memory 2>/dev/null || true
                  cat /proc/pressure/io 2>/dev/null || true
                  awk '$1 == "cpu" {print "iowait=" $6, "steal=" $9}' /proc/stat
                  vmstat 1 2
                  if command -v mpstat >/dev/null 2>&1; then mpstat -P ALL 1 2; fi
                  if command -v pidstat >/dev/null 2>&1; then pidstat -d -u -w 1 2; fi
                  echo "diskstats:"
                  cat /proc/diskstats
                  ps -eo pid,ppid,%cpu,%mem,rss,etime,cmd --sort=-%cpu | head -20
                  ps -eo pid,ppid,%cpu,%mem,rss,etime,cmd | grep -E '[q]emu-system|[b]azel|[p]ython' || true
                  echo "cgroup cpu.stat:"
                  cat /sys/fs/cgroup/cpu.stat 2>/dev/null || true
                  echo "cgroup memory.current/max:"
                  cat /sys/fs/cgroup/memory.current /sys/fs/cgroup/memory.max 2>/dev/null || true
                  cat /sys/fs/cgroup/memory/memory.usage_in_bytes /sys/fs/cgroup/memory/memory.limit_in_bytes 2>/dev/null || true
                  echo "network sockets (established & listening):"
                  ss -tneop 2>/dev/null || true
                  ss -ltnp 2>/dev/null || true
                  echo "----------------------------------------"
                } >> ci-resource-monitor.log 2>&1
                sleep 10
              done
            ) &
            echo $! > resource-monitor.pid
        - name: Test QNX
          if: inputs.fetch_only != 'true'
          id: run-tests
          env:
            SCORE_QNX_USER: ${{ secrets.SCORE_QNX_USER }}
            SCORE_QNX_PASSWORD: ${{ secrets.SCORE_QNX_PASSWORD }}
          run: |
            mkdir -p qemu-serial-logs
            echo "Starting loopback tcpdump..."
            sudo tcpdump -i lo -s 0 -w qnx-integration-test-lo.pcap 2>/dev/null &
            echo $! > tcpdump.pid

            echo "TEST_START=$(date -u +%Y-%m-%dT%H:%M:%SZ)" | tee -a ci-resource-monitor.log
            set +e
            bazel test --config=ci --config=qnx --runs_per_test=5 --test_env=DUAL_QEMU_SERIAL_DIR="$PWD/qemu-serial-logs" -- //quality/integration_testing/environments/dual_qemu/example_xvm:test_lib_memory_ivshmem_xvm //score/mw/com/gateway/transport_layer/qemu/test/integration_test:test_qemu_transport
            test_status=$?
            set -e
            echo "TEST_END=$(date -u +%Y-%m-%dT%H:%M:%SZ) STATUS=$test_status" | tee -a ci-resource-monitor.log
            exit "$test_status"
        - name: Upload failed Bazel test logs
          if: inputs.fetch_only != 'true' && failure() && steps.run-tests.outcome == 'failure'
          uses: ./.github/actions/00_infrastructure/upload_bazel_testlogs_on_failure
          with:
            artifact-name: bazel-testlogs-qnx
        - name: Stop resource monitor
          if: always()
          run: |
            if [ -f tcpdump.pid ]; then
              sudo kill "$(cat tcpdump.pid)" 2>/dev/null || true
              rm -f tcpdump.pid
            fi
            if [ -f qnx-integration-test-lo.pcap ]; then
              sudo chmod 644 qnx-integration-test-lo.pcap 2>/dev/null || true
              tcpdump -nn -tttt -r qnx-integration-test-lo.pcap > qnx-tcpdump-summary.log 2>/dev/null || true
            fi
            if [ -f resource-monitor.pid ]; then
              monitor_pid="$(cat resource-monitor.pid)"
              kill "$monitor_pid" 2>/dev/null || true
              wait "$monitor_pid" 2>/dev/null || true
            fi
            echo "FINAL_SNAPSHOT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> ci-resource-monitor.log
            uptime >> ci-resource-monitor.log
            free -h >> ci-resource-monitor.log
            cat /proc/pressure/cpu /proc/pressure/memory /proc/pressure/io >> ci-resource-monitor.log 2>/dev/null || true
            cat /sys/fs/cgroup/cpu.stat >> ci-resource-monitor.log 2>/dev/null || true
        - name: Upload CI resource reports
          if: always() && inputs.fetch_only != 'true'
          uses: actions/upload-artifact@v4
          with:
            name: qnx-ci-resource-reports
            path: |
              ci-resource-report.log
              ci-resource-monitor.log
              qnx-integration-test-lo.pcap
              qnx-tcpdump-summary.log
              qemu-serial-logs
            if-no-files-found: ignore
        - name: Fetch dependencies (--nobuild)
          if: inputs.fetch_only == 'true'
          env:
            SCORE_QNX_USER: ${{ secrets.SCORE_QNX_USER }}
            SCORE_QNX_PASSWORD: ${{ secrets.SCORE_QNX_PASSWORD }}
          run: bazel build --nobuild --config=ci --config=qnx -- //quality/integration_testing/environments/dual_qemu/example_xvm:test_lib_memory_ivshmem_xvm //score/mw/com/gateway/transport_layer/qemu/test/integration_test:test_qemu_transport

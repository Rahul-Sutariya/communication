  - id: flag-file-crawler-defensive
    category: defensive_programming
    platforms: [linux, qnx]  # applies to both platforms
    reason: >
      Defensive guard for flag file parsing. Only entered if a flag file exists,
      so the file must be parseable. Guard protects against filesystem race conditions.
    locations:
      - file: score/mw/com/impl/generic_skeleton_event.cpp
        line_start: 29
        line_end: 29

  - id: gateway-clear-nonblock-on-accepted-socket
    platforms: [linux, qnx]
    category: defensive_programming
    reason: >
       Defensive programming: Posix system call can only go wrong if the socket file descriptor is invalid,
       but socket has just been accepted in an earlier step.

  - id: gateway-handle-response-only-ack-response
    platforms: [linux, qnx]
    category: defensive_programming
    reason: >
       Defensive programming: Type has already been checked before this function has been called.

  - id: gateway-dispatch-loop-calls-handler
    platforms: [linux, qnx]
    category: tool_false_positive
    reason: >
       Coverage tool incorrectly marks this line as not covered. Lines immediately before and after are covered.
       Covered by the test BidirectionalTransportSocketFixture.DispatchThreadDeliversQueuedMessageToHandler
       inside score/mw/com/gateway/transport_layer/sample/bidirectional_transport_test.cpp

  - id: ivshmem-bind-shm-to-bar-shm-ctl-special-success
    category: platform_specific
    platforms: [qnx]
    reason: >
      The shm_ctl_special() success branch inside BindShmToBar() (x86_64 QNX only) requires the
      kernel to successfully back the shared-memory object with the ivshmem BAR's physical address
      using the Write-Back memory type. With a mock fd this syscall always returns -1 (EBADF).
      Reaching the success path requires a real ivshmem device on x86_64 QNX hardware.

  - id: ivshmem-write-directory-entry-idempotent
    category: platform_specific
    platforms: [qnx]
    reason: >
      The idempotent early-return inside WriteDirectoryEntry() (when an entry with the same
      name_hash and bar_offset is already present) guards against concurrent writes from two VMs.
      In single-process unit tests AllocateNamedTypedMemory() populates the local allocations_ cache
      after the first write, so WriteDirectoryEntry() is never called again for the same name.
      Triggering this path would require a multi-VM scenario that cannot be reproduced in isolation.

  - id: ivshmem-bar-discovery-hardware-path
    category: platform_specific
    platforms: [qnx]
    reason: >
      DiscoverIvshmemBar() calls raw QNX PCI subsystem APIs (ThreadCtl _NTO_TCTL_IO,
      pci_device_find, pci_device_attach, pci_device_read_cmd, pci_device_write_cmd,
      pci_device_read_ba, pci_device_detach) that require a real ivshmem PCI device
      attached to the VM. In unit test environments: the ThreadCtl failure branch is
      unreachable because privileged test processes always succeed; all code from
      pci_device_attach onward is unreachable because pci_device_find returns
      PCI_BDF_NONE (no real hardware). There are no score_baselibs abstractions for
      the QNX PCI subsystem APIs, making mock injection infeasible.

  - id: qemu-get-intervm-shm-sizes-fd-valid
    category: platform_specific
    platforms: [qnx]
    reason: >
      GetInterVmShmSizes() on QNX opens each shared-memory object with ::shm_open to query its
      size. In unit tests no real shared-memory objects exist, so ::shm_open always returns -1
      and the if (fd != -1) true-branch (fstat + assignment + close) is never entered.
      Reaching this path requires a live QNX IPC environment with pre-created shm objects,
      which cannot be reproduced in isolated unit tests.

  - id: qemu-worldwritable-ctor-gcc-artifact
    category: tool_false_positive
    platforms: [qnx]
    reason: >
      GCC/GCOV on QNX x86_64 emits a separate coverage counter for the
      WorldWritable{} aggregate-initialisation expression when it appears as the last
      argument on a continuation line of a multi-line function call. The enclosing
      AllocateNamedTypedMemoryAtOffset() call is verifiably exercised by tests, but the
      continuation-line counter is never incremented because QCC does not place a
      sequence-point counter on trivially-default-constructible temporaries passed by
      const reference. This is a GCOV instrumentation artefact with no
      score_baselibs workaround available.
